name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:api
      - run: npm run test:i18n
      - run: npm run test:agent
      - run: node --check host/apply.js && node --check host/tools.js && node --check host/api.js && node --check host/pdf.js
      - run: npm run verify
